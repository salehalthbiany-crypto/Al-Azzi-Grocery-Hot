name: Build Native C++ APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'ndk;25.2.9519653 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      - name: Accept Licenses and Configure NDK Environment
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Regenerate Executable Gradle Wrapper
        run: |
          rm -f gradlew
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK with Detailed Error Reporting
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > build_output.log 2>&1 || BUILD_FAILED=1

          if [ "${BUILD_FAILED:-0}" = "1" ]; then
            echo "## ❌ تفاصيل سبب الفشل المباشر (Error Report)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -A 35 -E "FAILURE:|\* What went wrong:|Caused by:|e: |error:|FAILED" build_output.log | head -n 60 >> $GITHUB_STEP_SUMMARY
            echo '----------------------------------------' >> $GITHUB_STEP_SUMMARY
            tail -n 30 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_output.log
            exit 1
          else
            echo "## ✅ تم تجميع ملف الـ APK بنجاح!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: '**/*.apk'
