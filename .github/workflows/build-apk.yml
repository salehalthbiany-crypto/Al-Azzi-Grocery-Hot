name: Build Native C++ APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Android SDK و NDK و CMake
      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'ndk;25.2.9519653 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      # 4. قبول تراخيص Android SDK
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. إصلاح خطأ نهايات الأسطر (CRLF -> LF) وتوليد Wrapper محلياً
      - name: Fix Gradle Wrapper & Line Endings
        run: |
          # إصلاح نهايات أسطر ملف gradlew إن وجد
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi
          # تثبيت وتحديث أداة Gradle التلقائية
          gradle wrapper

      # 6. بناء التطبيق واستخراج أسباب الأخطاء إن وجدت
      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      # 7. حفظ وتنزيل الـ APK الناتج عند النجاح
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk