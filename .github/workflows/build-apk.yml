name: Build Native C++ APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Android SDK و NDK و CMake
      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'ndk;25.2.9519653 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      # 4. قبول التراخيص وإعداد ملف local.properties
      - name: Accept Licenses and Setup Environment
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      # 5. بناء أداة Gradle Wrapper نظيفة
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # 6. البناء مع طباعة ملخص سبب الخطأ بوضوح في أسفل الشاشة
      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log || BUILD_STATUS=$?
          
          if [ "${BUILD_STATUS:-0}" -ne 0 ]; then
            echo " "
            echo "============================================================"
            echo "🚨 ملخص الخطأ المباشر (EXACT ERROR DETAILS):"
            echo "============================================================"
            grep -A 30 "* What went wrong:" build_output.log || grep -A 25 "FAILURE:" build_output.log || tail -n 40 build_output.log
            echo "============================================================"
            exit 1
          fi

      # 7. رفع ملف الـ APK عند النجاح
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"