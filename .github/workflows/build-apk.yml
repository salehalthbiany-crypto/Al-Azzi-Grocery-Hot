name: Build Native C++ APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Android SDK, NDK & CMake
      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'ndk;25.2.9519653 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      # 4. إعداد local.properties وتحديد NDK
      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      # 5. قبول التراخيص
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 6. منح صلاحية التنفيذ لـ gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 7. التجميع واستخراج سبب الخطأ فوراً إذا حدث فشل
      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace || {
            echo "================================================="
            echo "❌ تفاصيل سبب الفشل المباشر (Error Summary):"
            echo "================================================="
            ./gradlew assembleDebug --stacktrace | grep -E "error:|FAILED|Exception|Caused by:" -A 3 -B 1 || true
            exit 1
          }

      # 8. رفع الـ APK عند النجاح
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk