name: Build Native C++ APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Android SDK و NDK و CMake
      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'ndk;25.2.9519653 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      # 4. قبول التراخيص وضبط البيئة
      - name: Accept Licenses and Setup Environment
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      # 5. تنظيف واستعادة Gradle Wrapper
      - name: Setup Gradle Executable
        run: |
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      # 6. البناء
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 7. البحث والتجميع والرفع المباشر لجميع ملفات الـ APK الناتجة
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/**/*.apk"