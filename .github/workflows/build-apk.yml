name: Build Native C++ APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Android SDK و NDK 25 و CMake
      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'ndk;25.2.9519653 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      # 4. تثبيت Gradle 8.5 المستقر
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # 5. قبول التراخيص وضبط local.properties
      - name: Accept Licenses and Setup Environment
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      # 6. تدمير ملف gradlew التالف إن وجد وإعادة إنشائه بنظافة لتلافي خطأ 127
      - name: Regenerate Clean Gradle Wrapper
        run: |
          rm -f gradlew
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      # 7. التجميع المباشر المضمون
      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 8. حفظ ملف الـ APK الناتج للتنزيل
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk