name: Build Native C++ APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses and Configure NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fix Executable Permissions
        run: |
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi

      - name: Build APK with Gradle 8.5
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: '**/*.apk'