name: Build Al-Azzi Grocery APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Complete Android & Gradle Project Structure
        run: |
          # إنشاء المجلدات الأساسية
          mkdir -p gradle/wrapper app/src/main/java/com/azzigrocery/app app/src/main/res/layout

          # إنشاء ملفات الإعداد للجذر
          echo "rootProject.name = 'Al-Azzi-Grocery-Hot'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties

          # إنشاء إعدادات الـ Wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

          # تحميل وتركيب ملف الـ jar الخاص بـ Gradle Wrapper مباشرة لتجنب أي خطأ
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/subprojects/wrapper/src/integTest/resources/org/gradle/wrapper/gradle-wrapper.jar || true

          # إنشاء إعدادات تطبيق الـ Android
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.azzigrocery.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.azzigrocery.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # إنشاء ملف الواجهة
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0F172A"
              android:padding="16dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="بقالة العزي للمواد الغذائية"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"/>
          </LinearLayout>
          EOF

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
